# InduRTDB 点位配置样例
#
# ⚠️ 解析器只读 `points:` 之后的内容。写在它前面的任何键
#    （含 instance_id / max_points / max_subscribers）会被【静默忽略】。
#    这三项只能通过命令行设置：
#       --instance / --max-points / --max-subs
#
# 解析规则：
#   注释        # 起始到行尾
#   新点位      必须以 "- "（减号+空格）开头
#   空行/怪行   静默跳过，不报错
#   id 非数字   该点位整项被丢弃
#   id: 0       必须同时写 name，否则解析器的 "cur.id != 0" 判定会吞掉该点位
#
# 字段取值：
#   access  1=READ_ONLY（write() 被拒）  3=READ_WRITE
#   unit    0=无 1=°C 2=Pa 3=% 等
#   flags   特性位，仅允许已知位；未知位导致启动校验失败（退出码 2）
#
# ⚠️ type 的可用取值见 src/core/irt_config.c: irt_config_parse_type
#
#   bool
#   int32   （别名 int）
#   double  （别名 float —— 注意会被当成 double，不保留单精度）
#   string  （别名 str）
#   int64        （v3.8 D6 起支持）
#   uint32       （v3.8 D6 起支持）
#
#     INDURTDB_TYPE_FLOAT(6) 是类型集合上限，但解析器不产出该值：
#     "float" 这个词历史上就映射到 double，改动会使既有配置的点位
#     静默降为单精度，故维持原状。
#
# v3.9 T5：可选分区白名单与别名（写在 `points:` 之前）
#   partitions: [0, 1, 2]                    # 十进制 uint32 白名单；缺省或空列表 = 任意分区合法
#   partition_alias: {0: "default", 1: "unitA"}  # uint32 → 字符串别名（仅供展示，T5 无协议面）
#   存在白名单时，别名键必须都在白名单内，否则配置错误（fail-fast，退出码 2）。
#
# 示例（取消注释启用）：
# partitions: [0, 1]
# partition_alias: {0: "default", 1: "unitA"}

points:
  # ---- 采集点：温度 ----
  - id: 1001
    name: "AHU_01.Supply_Temp"
    type: double
    unit: 1
    access: 3
    eur_min: -50.0
    eur_max: 150.0
    flags: 1

  # ---- 采集点：带绝对死区的湿度 ----
  - id: 1002
    name: "AHU_01.Supply_Temp_Humidity"
    type: double
    unit: 3
    access: 3
    deadband: 0.5

  # ---- 采集点：带百分比死区的压力 ----
  - id: 1003
    name: "AHU_01.Supply_Pressure"
    type: double
    unit: 2
    access: 3
    eur_min: 0.0
    eur_max: 5000.0
    deadband: 1.0

  # ---- 采集点：整型累计量（int32）----
  - id: 1004
    name: "AHU_01.Energy_Total"
    type: int32
    access: 3

  # ---- 控制点：布尔量 ----
  - id: 2001
    name: "Pump_01.Start_CMD"
    type: bool
    access: 3

  # ---- 控制点：整型设定值 ----
  - id: 2002
    name: "Fan_01.Speed_Setpoint"
    type: int32
    access: 3

  # ---- 只读点：设备状态由驱动上报，运行期只读 ----
  - id: 3001
    name: "Pump_01.Running_Status"
    type: bool
    access: 1

  # ---- 状态文本（string 最长 31 字符 + 终止符）----
  - id: 3002
    name: "AHU_01.Mode_Text"
    type: string
    access: 1

  # ---- 模拟量 ----
  - id: 1005
    name: "AHU_01.Coil_Valve_Position"
    type: double
    unit: 3
    access: 3

  # ---- 64 位累计量 / 无符号整型 ----
  - id: 1006
    name: "AHU_01.Energy_Total_Wh"
    type: int64
    access: 3

  - id: 1007
    name: "AHU_01.Run_Count"
    type: uint32
    access: 3

