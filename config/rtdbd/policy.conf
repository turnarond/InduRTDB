# InduRTDB rtdbd 鉴权策略样例
#
# 格式：每行  uid:partition|*:min_point_id:max_point_id   （十进制，闭区间）
#        第 2 段写 * 表示「所有分区」；写具体数字表示仅限该分区。
# 注释：  # 起始到行尾；空行忽略；各段首尾空白忽略
# 限制：  规则数上限 32；单行（含行尾注释）上限 128 字节
#
# 匹配语义：rtdbd 用 SO_PEERCRED 取对端进程 uid，依次匹配
#           uid → 分区（* 跳过该步）→ point_id 落在 [min_id, max_id] 内，
#           全部命中则放行。
# 未命中：  拒绝（deny by default）
#
# ⚠️ 重要：不传 --policy 等价于「拒绝所有写」——rtdbd 仍会正常启动、
#    健康检查也会通过，但所有写请求被拒且无报错。
# ✅ 格式错误即 fail-fast：任何一行不合规（段数不是 4 / 非十进制数字 /
#    数值溢出 uint32 / min_id > max_id / 单行超长 / 规则数超 32），
#    rtdbd 打印  invalid policy <path>: line <n>: <原因>
#    并以退出码 2 终止，supervisor/systemd 据此停止重启。**不再静默跳过。**
#
# 注：分区限定行（如 `1001:1:0:999`）需服务端携带分区维度方能命中；
#    v3.9 协议分区（T5）落地前，rtdbd 一律按分区 0 鉴权，故本样例用 * 通配
#    以保证可直接使用。

# ---- 示例：按 uid 分段授权 ----

# 应用服务账号：所有分区的 1000-2999 段（采集点）
1001:*:1000:2999

# 监控台账号：只读不写，故不授予任何写区间
# （读路径不经 rtdbd 鉴权，直读共享内存）

# root：所有分区全段。生产环境建议收窄到实际需要的范围
0:*:0:4294967295
