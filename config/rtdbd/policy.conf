# InduRTDB rtdbd 鉴权策略样例
#
# 格式：每行  uid:min_point_id:max_point_id   （十进制，闭区间）
# 注释：  # 起始到行尾
# 限制：  规则数上限 32；单行上限 128 字节
#
# 匹配语义：rtdbd 用 SO_PEERCRED 取对端进程 uid，
#           uid 命中且 point_id 落在 [min_id, max_id] 内则放行
# 未命中：  拒绝（deny by default）
#
# ⚠️ 重要：不传 --policy 等价于「拒绝所有写」——rtdbd 仍会正常启动、
#    健康检查也会通过，但所有写请求被拒且无报错。
# ⚠️ 重要：格式错误的行被【静默跳过】，启动不报错、退出码正常。
#    规则全写错等同「拒绝所有写」。自查：
#      grep -vE '^\s*(#|$)' policy.conf | wc -l
#    该值必须等于预期规则数。

# ---- 示例一：按 uid 分段授权 ----

# 应用服务账号：可写 1000-2999 段（采集点）
1001:1000:2999

# 监控台账号：只读不写，故不授予任何写区间
# （读路径不经 rtdbd 鉴权，直读共享内存）

# root：允许全段。生产环境建议收窄到实际需要的范围
0:0:4294967295
