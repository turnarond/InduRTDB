# InduRTDB CI 流水线
# 触发: push 到 main/feature 分支, PR 到 main
# 矩阵: Debug + Release 双配置
# 阶段: 构建 → ctest → verify_consume → soak(短) + bench(快)
name: InduRTDB CI

on:
  push:
    branches: [main, "feature/**"]
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
    branches: [main]
  workflow_dispatch: # 手动触发

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: "${{ matrix.build_type }} | gcc"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]

    steps:
      # ---- 检出 ----
      - name: Checkout
        uses: actions/checkout@v4

      # ---- 依赖 ----
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            cmake ninja-build libgtest-dev pkg-config

      # ---- 构建 ----
      - name: Configure (CMake)
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: cmake --build build -j$(nproc)

      # ---- 测试 ----
      - name: ctest
        working-directory: build
        run: ctest --output-on-failure -j$(nproc)

      # ---- 外部消费验证 ----
      - name: verify_consume.sh
        run: bash scripts/verify_consume.sh

  soak-and-bench:
    name: "soak + bench (Release only)"
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            cmake ninja-build pkg-config

      - name: Configure & Build (Release)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j$(nproc)

      - name: soak 短时长 (30s)
        run: SOAK_DURATION=30 bash scripts/run_soak.sh

      - name: bench 快速模式
        run: bash scripts/run_bench.sh --quick
